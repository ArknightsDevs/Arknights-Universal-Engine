name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      # the pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # lint (limits, boundaries, determinism), types (checkJs strict), tests with coverage thresholds, and the
      # dependency / spec-tracing / registry checks
      - name: CI
        run: pnpm run ci
